services:
  app:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      FIREBASE_SERVICE_ACCOUNT_JSON_PATH: /run/secrets/firebase.json
    volumes:
      - type: bind
        source: ./.env
        target: /config/.env
        bind:
          create_host_path: false
      - type: bind
        source: ./config.conf
        target: /config/config.conf
        bind:
          create_host_path: false
      - type: bind
        source: ./trackingorderhub-firebase-adminsdk-fbsvc-33c2131df3.json
        target: /run/secrets/firebase.json
        read_only: true
        bind:
          create_host_path: false
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  app_logs:
