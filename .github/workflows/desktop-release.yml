name: Build Windows Desktop App

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản phát hành (VD: 1.0.0)'
        required: false
        default: '1.0.0'
      publish_release:
        description: 'Tự động tạo bản phát hành trên GitHub Releases (để trang /download tải trực tiếp)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Sync version if specified
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver -and "${{ github.ref_name }}" -match '^(?:desktop-)?v(\d+\.\d+\.\d+.*)$') {
            $ver = $Matches[1]
          }
          if ($ver) {
            $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
            $conf.version = $ver
            $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8
          }

      - name: Install Tauri CLI
        run: npm install --no-audit --no-fund

      - name: Build Windows NSIS (.exe) & MSI installers
        run: npx tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrderTracker-Windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version || '1.0.0') }}
          name: Order Tracker Windows ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version || '1.0.0') }}
          body: |
            ### Order Tracker cho Windows 10 / 11 (x64)
            - **Bộ cài khuyến nghị (`.exe`)**: Cài đặt nhanh không cần quyền Admin, hỗ trợ tiếng Việt.
            - **Tính năng**: Chạy ngầm ở System Tray, thông báo Windows Toast theo giai đoạn kèm tiền COD, tự khởi động cùng hệ thống, phím tắt `Ctrl + Shift + T` thêm vận đơn nhanh từ Clipboard.
          draft: false
          prerelease: false
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
