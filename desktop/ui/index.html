<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --canvas: #f6f7fa;
            --surface: #ffffff;
            --ink: #202838;
            --muted: #586174;
            --line: #dce0e8;
            --danger-bg: #fef2f2;
            --danger-ink: #991b1b;
            --danger-border: #fecaca;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #5b54f0;
                --primary-hover: #6c65f7;
                --canvas: #0b0f17;
                --surface: #131926;
                --ink: #edf2f9;
                --muted: #98a6be;
                --line: #253047;
                --danger-bg: #2e1216;
                --danger-ink: #fca5a5;
                --danger-border: #63232b;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--canvas);
            color: var(--ink);
            font-family: "Inter", "Segoe UI", system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.55;
        }
        .shell {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 32px 28px;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            display: inline-grid;
            place-items: center;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 20px;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0 0 20px;
            font-size: 14px;
            color: var(--muted);
        }
        .err {
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-ink);
            font-size: 14px;
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--canvas);
            color: var(--ink);
            font: 14px ui-monospace, Consolas, monospace;
        }
        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .chip {
            min-height: 36px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .actions {
            margin-top: 22px;
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            min-height: 44px;
            padding: 10px 16px;
            border-radius: 10px;
            border: 0;
            background: var(--primary);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { background: var(--primary-hover); }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="shell">
        <div class="brand">
            <span class="mark" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
                    <path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>
                </svg>
            </span>
            <span>Order Tracker Desktop</span>
        </div>

        <div id="boot-view">
            <h1>Đang kết nối máy chủ Order Tracker…</h1>
            <p>Đang mở bảng điều khiển vận đơn và đồng bộ khay hệ thống Windows.</p>
        </div>

        <div id="config-view" hidden>
            <h1>Cấu hình máy chủ kết nối</h1>
            <p>Chọn địa chỉ máy chủ Order Tracker để kết nối ứng dụng Windows.</p>
            <div id="conn-err" class="err" hidden>Không thể kết nối tới máy chủ. Vui lòng kiểm tra mạng hoặc đổi địa chỉ bên dưới.</div>

            <form id="server-form">
                <label for="server-url">Địa chỉ máy chủ (Server URL)</label>
                <input id="server-url" type="url" value="https://app.dev8084.io.vn" required>
                <div class="presets">
                    <button type="button" class="chip" data-preset="https://app.dev8084.io.vn">Production (app.dev8084.io.vn)</button>
                    <button type="button" class="chip" data-preset="http://127.0.0.1:8084">Local Docker (127.0.0.1:8084)</button>
                </div>
                <div class="actions">
                    <button type="submit" class="btn">Lưu &amp; kết nối ngay</button>
                </div>
            </form>
        </div>
    </main>

    <script>
    (async () => {
        const invoke = window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
        const params = new URLSearchParams(window.location.search);
        const forceConfig = params.get('configure') === '1';

        const bootView = document.getElementById('boot-view');
        const cfgView = document.getElementById('config-view');
        const errBox = document.getElementById('conn-err');
        const urlInput = document.getElementById('server-url');
        const form = document.getElementById('server-form');

        document.querySelectorAll('[data-preset]').forEach((btn) => {
            btn.addEventListener('click', () => {
                urlInput.value = btn.getAttribute('data-preset');
            });
        });

        let targetServer = 'https://app.dev8084.io.vn';
        let targetPath = '/dashboard';
        if (invoke) {
            try {
                const prefs = await invoke('get_desktop_prefs');
                if (prefs && prefs.serverUrl) targetServer = prefs.serverUrl;
                if (prefs && !prefs.hasToken) targetPath = '/auth/login';
            } catch (_) {}
        }
        urlInput.value = targetServer;

        const connectTo = async (rawBase) => {
            const base = rawBase.trim().replace(/\/+$/, '');
            errBox.hidden = true;
            bootView.hidden = false;
            cfgView.hidden = true;
            try {
                const ctl = new AbortController();
                const timer = setTimeout(() => ctl.abort(), 5000);
                const res = await fetch(base + '/api/v1/health', { signal: ctl.signal, mode: 'cors' }).catch(() => null);
                clearTimeout(timer);
                if (invoke) {
                    await invoke('switch_server_url', { serverUrl: base });
                }
                if (res || base.startsWith('https://')) {
                    window.location.replace(base + targetPath);
                    return;
                }
                throw new Error('unreachable');
            } catch (_) {
                bootView.hidden = true;
                cfgView.hidden = false;
                errBox.hidden = false;
            }
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            connectTo(urlInput.value);
        });

        if (forceConfig) {
            bootView.hidden = true;
            cfgView.hidden = false;
        } else {
            connectTo(targetServer);
        }
    })();
    </script>
</body>
</html>
